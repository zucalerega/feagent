[project]
name = "feagent"
version = "0.1.0"
description = "Agentic FEA: meshing harness (feagent) plus the fixed solver, solution verification and benchmarks (feacore)"
readme = "README.md"
authors = [
    { name = "Alexander Aghili", email = "alexander.w.aghili@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gmsh>=4.15.2",
    "mcp[cli]>=2.3.0",
    "meshio>=5.3",
    "numpy>=2.5.4",
    "pyamg>=5.4.1",
    "pyvista>=0.49.2",
    "pyyaml>=6.0.3",
    "scikit-fem>=12.0.2",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
ui = ["fastapi", "uvicorn", "python-multipart"]
gpu = ["nvmath-python", "cupy-cuda12x"]
pardiso = ["pypardiso"]
cfd = ["foamlib"]
feabench = ["h5py"]   # code_aster MED meshes

[project.scripts]
feagent = "feagent.cli:main"
feagent-mcp = "feagent.mcp_server:main"
feabench = "feabench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshing-harness/src/feagent", "feacore", "feabench"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "matplotlib",
    "sympy",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests", "meshing-harness/tests"]
pythonpath = ["meshing-harness/src", "."]
markers = ["slow: longer convergence / 3D checks (deselect with -m 'not slow')"]
