[project]
name = "feagent"
version = "0.1.0"
description = "Meshing harness that lets LLM agents mesh existing STEP CAD for FEA/CFD"
readme = "README.md"
authors = [
    { name = "Alexander Aghili", email = "alexander.w.aghili@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gmsh>=4.15.2",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "pyamg>=5.4.1",
    "pyvista>=0.49.2",
    "pyyaml>=6.0.3",
    "scikit-fem>=12.0.2",
    "scipy>=1.18.1",
]

[project.scripts]
feagent = "feagent.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
