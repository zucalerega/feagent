<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Training system</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  svg { display: block; font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .h { font-size: 30px; font-weight: 700; }
  .t { font-size: 21px; fill: #1d1d1f; }
  .s { font-size: 18px; fill: #5f6368; }
  .b { font-weight: 700; }
  .lbl { font-size: 18px; fill: #444; font-style: italic; }
</style></head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
    <g id="notes"><rect x="0" y="0" width="22" height="28" rx="3" fill="#fff" stroke="#5b3fa0" stroke-width="2"/>
      <line x1="5" y1="8" x2="17" y2="8" stroke="#5b3fa0" stroke-width="2"/><line x1="5" y1="14" x2="17" y2="14" stroke="#5b3fa0" stroke-width="2"/>
      <line x1="5" y1="20" x2="13" y2="20" stroke="#5b3fa0" stroke-width="2"/></g>
  </defs>

  <text x="60" y="64" style="font-size:42px;font-weight:800" fill="#1d1d1f">How the swarm trains</text>

  <!-- ===== every-generation loop (over the top: results -> rewritten notebooks) ===== -->
  <path d="M1620,148 L1620,112 L295,112 L295,146" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="560" y="96" width="900" height="32" fill="#fff"/>
  <text x="1010" y="119" class="t" text-anchor="middle" style="font-size:21px"><tspan class="b">Every round:</tspan> a teacher (Claude Opus) reviews all attempts → every notebook is rewritten</text>

  <!-- ================= LEFT: one agent, learning by notebook ================= -->
  <rect x="50" y="150" width="490" height="650" rx="18" fill="#f3f7f7" stroke="#0f766e" stroke-width="2.5"/>
  <text x="80" y="198" class="h" fill="#0f766e">Each agent</text>
  <circle cx="112" cy="258" r="32" fill="#5b3fa0"/><text x="112" y="266" class="t b" fill="#fff" text-anchor="middle" style="font-size:22px">a0</text>
  <text x="162" y="250" class="t b">Claude Sonnet</text>
  <text x="162" y="276" class="s">meshes a CAD part, solves, checks</text>
  <rect x="80" y="310" width="430" height="74" rx="12" fill="#0f766e"/>
  <text x="295" y="341" class="t b" fill="#fff" text-anchor="middle">The model never changes.</text>
  <text x="295" y="369" class="t b" fill="#fff" text-anchor="middle">What learns is its notebook.</text>
  <text x="80" y="424" class="t">Before every attempt it reads:</text>
  <!-- notebook -->
  <rect x="80" y="440" width="430" height="300" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/>
  <line x1="104" y1="440" x2="104" y2="740" stroke="#e8b4c4" stroke-width="2"/>
  <g class="t" style="font-size:20px">
    <text x="122" y="480" class="b">📌 What to try this round</text>
    <text x="150" y="505" class="s" style="font-size:17px">its experiment, from the teacher</text>
    <text x="122" y="550" class="b">💬 Feedback on its last try</text>
    <text x="150" y="575" class="s" style="font-size:17px">teacher's critique + its own reflection</text>
    <text x="122" y="620" class="b">📓 Its own notes</text>
    <text x="150" y="645" class="s" style="font-size:17px">lessons it has learned so far</text>
    <text x="122" y="690" class="b">👥 The team's notes</text>
    <text x="150" y="715" class="s" style="font-size:17px">what worked for the other agents</text>
  </g>
  <text x="80" y="776" class="s">Like a new hire learning from notes and reviews.</text>

  <!-- ================= MIDDLE: the swarm ================= -->
  <rect x="590" y="150" width="710" height="650" rx="18" fill="#f4f1fb" stroke="#5b3fa0" stroke-width="2.5"/>
  <text x="620" y="198" class="h" fill="#5b3fa0">Decentralized swarm</text>
  <rect x="650" y="222" width="600" height="76" rx="12" fill="#fff" stroke="#1e9e6a" stroke-width="2.5"/>
  <text x="950" y="255" class="t b" text-anchor="middle">Team notebook (shared)</text>
  <text x="950" y="283" class="s" text-anchor="middle">the teacher's lessons + the best attempts' highlights</text>
  <g stroke="#1e9e6a" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#ar)">
    <path d="M700,374 L740,304"/><path d="M860,374 L880,304"/><path d="M1020,374 L1000,304"/><path d="M1180,374 L1140,304"/>
  </g>
  <g>
    <g transform="translate(700,430)"><circle r="44" fill="#5b3fa0" stroke="#0f766e" stroke-width="5"/><text y="9" class="t b" fill="#fff" text-anchor="middle" style="font-size:25px">a0</text><use href="#notes" x="32" y="-58"/></g>
    <g transform="translate(860,430)"><circle r="44" fill="#5b3fa0"/><text y="9" class="t b" fill="#fff" text-anchor="middle" style="font-size:25px">a1</text><use href="#notes" x="32" y="-58"/></g>
    <g transform="translate(1020,430)"><circle r="44" fill="#5b3fa0"/><text y="9" class="t b" fill="#fff" text-anchor="middle" style="font-size:25px">a2</text><use href="#notes" x="32" y="-58"/></g>
    <g transform="translate(1180,430)"><circle r="44" fill="#5b3fa0"/><text y="9" class="t b" fill="#fff" text-anchor="middle" style="font-size:25px">a3</text><use href="#notes" x="32" y="-58"/></g>
    <g transform="translate(700,615)"><circle r="44" fill="#5b3fa0"/><text y="9" class="t b" fill="#fff" text-anchor="middle" style="font-size:25px">a4</text><use href="#notes" x="32" y="-58"/></g>
    <g transform="translate(860,615)"><circle r="44" fill="#5b3fa0"/><text y="9" class="t b" fill="#fff" text-anchor="middle" style="font-size:25px">a5</text><use href="#notes" x="32" y="-58"/></g>
    <g transform="translate(1020,615)"><circle r="44" fill="#5b3fa0"/><text y="9" class="t b" fill="#fff" text-anchor="middle" style="font-size:25px">a6</text><use href="#notes" x="32" y="-58"/></g>
    <g transform="translate(1180,615)"><circle r="44" fill="#5b3fa0"/><text y="9" class="t b" fill="#fff" text-anchor="middle" style="font-size:25px">a7</text><use href="#notes" x="32" y="-58"/></g>
  </g>
  <g class="s" text-anchor="middle" style="font-size:17px">
    <text x="700" y="498" fill="#1d1d1f" class="b">control</text>
    <text x="860" y="498">variant</text><text x="1020" y="498">variant</text><text x="1180" y="498">variant</text>
    <text x="700" y="683">variant</text><text x="860" y="683">variant</text>
    <text x="1020" y="683" fill="#c06a12" class="b">explorer</text><text x="1180" y="683" fill="#c06a12" class="b">explorer</text>
  </g>
  <g stroke="#9b8cc8" stroke-width="2" fill="none" stroke-dasharray="3 6">
    <path d="M744,430 L816,430"/><path d="M904,430 L976,430"/><path d="M1064,430 L1136,430"/>
    <path d="M744,615 L816,615"/><path d="M904,615 L976,615"/><path d="M1064,615 L1136,615"/>
    <path d="M731,461 L829,584"/><path d="M1051,461 L1149,584"/><path d="M989,461 L891,584"/>
  </g>
  <text x="950" y="740" class="s" text-anchor="middle">8 agents work in parallel, each with its own notebook and its own experiment</text>
  <!-- zoom: a0 is the agent described on the left -->
  <g stroke="#0f766e" stroke-width="1.8" stroke-dasharray="4 5" fill="none">
    <path d="M664,404 L540,222"/><path d="M664,456 L540,296"/>
  </g>

  <!-- ================= RIGHT: competition + collaboration ================= -->
  <rect x="1370" y="150" width="500" height="650" rx="18" fill="#fbf7f9" stroke="#888" stroke-width="2"/>
  <text x="1400" y="198" class="h" fill="#c23d6e">Competition</text>
  <g>
    <text x="1400" y="236" class="t b" style="font-size:18px">a3</text><rect x="1438" y="219" width="330" height="22" rx="5" fill="#c23d6e"/><text x="1778" y="238" style="font-size:20px">🏆</text>
    <text x="1400" y="268" class="t b" style="font-size:18px">a0</text><rect x="1438" y="251" width="280" height="22" rx="5" fill="#c23d6e" opacity="0.7"/>
    <text x="1400" y="300" class="t b" style="font-size:18px">a6</text><rect x="1438" y="283" width="230" height="22" rx="5" fill="#c23d6e" opacity="0.5"/>
  </g>
  <text x="1400" y="346" class="t b">Ranked against the automesher</text>
  <text x="1400" y="371" class="s">accuracy over the whole part, per unknown</text>
  <text x="1400" y="414" class="t b">Be the best</text>
  <text x="1400" y="439" class="s">each hidden check point pays only the most</text>
  <text x="1400" y="462" class="s">accurate attempt; a tie pays nobody</text>
  <text x="1400" y="505" class="t b">Be different</text>
  <text x="1400" y="530" class="s">bonus for a new recipe within 90 % of the best</text>
  <line x1="1400" y1="560" x2="1840" y2="560" stroke="#888" stroke-width="1" opacity="0.5"/>
  <text x="1400" y="600" class="h" fill="#1e9e6a">Collaboration</text>
  <text x="1400" y="640" class="t b">Team notebook</text>
  <text x="1400" y="664" class="s">the teacher's lessons + the best attempts' highlights</text>
  <text x="1400" y="704" class="t b">Learn from peers</text>
  <text x="1400" y="728" class="s">everyone sees what worked, and how to copy it</text>
  <text x="1400" y="766" class="t b">Split the search</text>
  <text x="1400" y="790" class="s" style="font-size:17px">control, variants and explorers test different ideas</text>

  <!-- swarm -> right -->
  <line x1="1300" y1="475" x2="1368" y2="475" stroke="#333" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1335" y="462" class="lbl" text-anchor="middle" style="font-size:17px">meshes</text>

  <!-- ================= BOTTOM: custom benchmark ================= -->
  <rect x="50" y="852" width="1820" height="208" rx="18" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="80" y="900" class="h" fill="#2a78d6">Our custom benchmark</text>
  <text x="80" y="936" class="s">real third-party CAD, loads we generated,</text>
  <text x="80" y="960" class="s">answers we certified ourselves,</text>
  <text x="80" y="984" class="s">+ our own lab tests</text>

  <text x="610" y="886" class="s b" fill="#2a78d6">WHAT THE AGENTS GET</text>
  <rect x="610" y="900" width="320" height="78" rx="12" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
  <text x="630" y="933" class="t b">Real CAD parts</text><text x="630" y="961" class="s">ABC dataset</text>
  <line x1="930" y1="939" x2="966" y2="939" stroke="#333" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="970" y="900" width="330" height="78" rx="12" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
  <text x="990" y="933" class="t b">Generated supports + loads</text><text x="990" y="961" class="s">many load cases per part</text>
  <text x="955" y="1030" class="s" text-anchor="middle">the task: a part, how it is held and loaded, what to compute</text>

  <text x="1380" y="886" class="s b" fill="#2a78d6">WHAT ONLY THE SCORER SEES</text>
  <rect x="1380" y="900" width="470" height="66" rx="12" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
  <text x="1400" y="930" class="t b" style="font-size:19px">Certified reference answers</text>
  <text x="1400" y="954" class="s" style="font-size:16px">nested meshes solved on an H100, convergence-checked</text>
  <rect x="1380" y="978" width="470" height="66" rx="12" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
  <text x="1400" y="1008" class="t b" style="font-size:19px">Real lab tests</text>
  <text x="1400" y="1032" class="s" style="font-size:16px">3D-printed parts crushed on an Instron: force curves</text>

  <!-- benchmark -> swarm, benchmark -> scoring -->
  <line x1="955" y1="898" x2="955" y2="804" stroke="#2a78d6" stroke-width="3" marker-end="url(#arb)"/>
  <text x="968" y="836" class="lbl" fill="#2a78d6">the task</text>
  <line x1="1830" y1="898" x2="1830" y2="804" stroke="#2a78d6" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arb)"/>
  <text x="1816" y="836" class="lbl" fill="#2a78d6" text-anchor="end">hidden answers, used only to score</text>
</svg>
</body></html>
