<title>Agent Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the blackboard schematic, left to right. Shared context (the playbook) and the improve
   step on the left; one lane per task with every agent's card in the middle (strengths and
   weaknesses, error curve over its solves); incentive on the right (where each agent placed, how
   everyone did per generation). Chalk handwriting only for the board's own stage labels. */
:root {
  --bg: #eef1ee; --panel: #ffffff; --sunk: #f4f6f4; --ink: #16201b; --ink-2: #47534d; --muted: #77827c;
  --line: #d6ddd8; --board: #24332c; --chalk: #f3f1e8; --chalk-2: #c9cfc8;
  --accent: #2a78d6; --accent-soft: #e3eefb;
  --good: #1d7f48; --good-soft: #e1f3e8; --warn: #9a6200; --warn-soft: #fbf0d9; --bad: #b42318; --bad-soft: #fbe5e2;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #6250d6;
  --chalkfont: "Caveat", "Bradley Hand", "Segoe Print", cursive;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141a17; --panel: #1b2420; --sunk: #17201c; --ink: #e9eee9; --ink-2: #b8c2bc; --muted: #86918b;
  --line: #2d3a34; --board: #1f2c26; --chalk: #f3f1e8; --chalk-2: #aeb7b0;
  --accent: #4b93ea; --accent-soft: #1b2a3d;
  --good: #4cc286; --good-soft: #163324; --warn: #e0a83a; --warn-soft: #3a2c11; --bad: #f2806a; --bad-soft: #3d1a15;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141a17; --panel: #1b2420; --sunk: #17201c; --ink: #e9eee9; --ink-2: #b8c2bc; --muted: #86918b;
  --line: #2d3a34; --board: #1f2c26; --chalk: #f3f1e8; --chalk-2: #aeb7b0;
  --accent: #4b93ea; --accent-soft: #1b2a3d;
  --good: #4cc286; --good-soft: #163324; --warn: #e0a83a; --warn-soft: #3a2c11; --bad: #f2806a; --bad-soft: #3d1a15;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--board); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.chalk { font-family: var(--chalkfont); font-weight: 700; letter-spacing: .01em; }

/* board header */
header.board { background: var(--board); color: var(--chalk); }
header.board .in { max-width: 1480px; margin: 0 auto; padding-block: 18px 16px; display: grid; gap: 12px; }
.toprow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline; justify-content: space-between; }
h1 { margin: 0; font: 700 34px/1 var(--chalkfont); color: var(--chalk); }
.goal { font: 500 22px/1.2 var(--chalkfont); color: var(--chalk-2); text-wrap: balance; }
.goal b { color: var(--chalk); font-weight: 700; }
.status { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 500 13px var(--body); color: var(--chalk-2); }
.live { display: inline-flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chalk-2); }
.dot.on { background: #6fd39b; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.gens { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.gens button { font: 500 13px var(--body); color: var(--chalk); background: transparent; border: 1.5px solid color-mix(in srgb, var(--chalk) 45%, transparent); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.gens button[aria-pressed="true"] { background: var(--chalk); color: var(--board); border-color: var(--chalk); }
.gens button:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
.gens .again { font: 700 18px var(--chalkfont); color: var(--chalk-2); padding: 0 4px; }
.answer { display: flex; gap: 22px; flex-wrap: wrap; }
.answer div { display: grid; }
.answer .v { font: 600 22px var(--mono); font-variant-numeric: tabular-nums; color: var(--chalk); }
.answer .l { font-size: 12.5px; color: var(--chalk-2); }

/* three columns, like the board */
main { max-width: 1480px; margin: 0 auto; padding-block: 18px 48px; display: grid; gap: 18px; grid-template-columns: 300px minmax(0, 1fr) 320px; align-items: start; }
@media (max-width: 1180px) { main { grid-template-columns: minmax(0, 1fr) 300px; } .col-ctx { grid-column: 1 / -1; order: 3; } }
@media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } .col-ctx { order: 0; } }
.col { display: grid; gap: 14px; min-width: 0; align-content: start; }
.stage { font: 700 24px/1 var(--chalkfont); color: var(--ink-2); margin: 0; display: flex; gap: 8px; align-items: baseline; }
.stage small { font: 400 12.5px var(--body); color: var(--muted); }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; display: grid; gap: 8px; }
.box h3 { margin: 0; font: 600 13px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.empty { color: var(--muted); font-style: italic; }

/* playbook */
.bullet { display: grid; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
.bullet:first-of-type { border-top: 0; }
.bullet .meta { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.bullet .id { font: 500 12px var(--mono); color: var(--accent); }
.bullet .votes { font: 12px var(--mono); color: var(--muted); }
.bullet.new .id::after { content: " new"; font: 600 10.5px var(--body); color: var(--good); text-transform: uppercase; letter-spacing: .05em; }
.bullet .txt { font-size: 13px; color: var(--ink); }
.chg { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 11.5px var(--body); padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
details.lessons summary { cursor: pointer; font-weight: 500; }
details.lessons summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details.lessons ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }

/* task lanes */
.lane { display: grid; gap: 10px; }
.lanehead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.lanehead h2 { margin: 0; font: 600 15px var(--mono); }
.lanehead .stat { font-size: 13px; color: var(--ink-2); }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.card.running { border-style: dashed; }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .who { font: 600 13px var(--body); }
.rank { font: 600 12px var(--mono); color: var(--muted); }
.rank.first { color: var(--good); }
.pill { font: 500 12px var(--mono); padding: 1px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.p-good { background: var(--good-soft); color: var(--good); } .p-mid { background: var(--sunk); color: var(--ink-2); }
.p-warn { background: var(--warn-soft); color: var(--warn); } .p-bad { background: var(--bad-soft); color: var(--bad); }
.curve svg, .spark svg { display: block; width: 100%; height: auto; }
.curve text, .chart text { fill: var(--muted); font: 10px var(--body); }
.prof { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; font-size: 11.5px; color: var(--ink-2); }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.tries { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.tries b { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.t-fit { background: var(--good); } .t-over { background: var(--bad); opacity: .7; } .t-unk { background: var(--muted); opacity: .5; }
.foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.issues { font-size: 11.5px; color: var(--warn); }

/* incentive */
.strip svg, .chart svg { display: block; width: 100%; height: auto; }
.strip .lbl { font: 500 12px var(--mono); color: var(--ink-2); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 16px; border-top: 2px solid; display: inline-block; }
.legend i.dash { border-top-style: dashed; }
.board-err { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 10px 12px; }
@media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
</style>

<header class="board gutter"><div class="in" id="hdr"></div></header>
<main class="gutter" id="main"></main>

<script id="ace-data" type="application/json">/*__DATA__*/null</script>
<script>
(function () {
  const EMBED = JSON.parse(document.getElementById("ace-data").textContent);
  const $hdr = document.getElementById("hdr"), $main = document.getElementById("main");
  let D = EMBED, sel = null, follow = true, failed = false;

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
    return el;
  }
  const S = (tag, attrs, ...kids) => { const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v); for (const k of kids) el.append(k); return el; };
  const fmtScore = s => s == null ? "–" : (s >= 0 ? "+" : "") + s.toFixed(2);
  const fmtPct = e => e == null ? "–" : (e * 100 < 0.1 ? (e * 100).toFixed(3) : (e * 100).toFixed(2)) + "%";
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const short = pid => pid.replace("_finite_width", "").replace("_axi_Dd2_rd0p1", " (axisym)").replaceAll("_", " ");
  function scorePill(s) {
    if (s == null) return h("span", {class: "pill p-mid"}, "–");
    const c = s <= D.score_floor + 1e-9 ? "p-bad" : s < 0 ? "p-warn" : s < 0.5 ? "p-mid" : "p-good";
    return h("span", {class: "pill " + c, title: "score = log10(e_uniform / e_agent)"}, fmtScore(s));
  }
  const isHold = pid => D.holdout.includes(pid);
  const colorOf = pid => `var(--s${D.problems.indexOf(pid) % 4 + 1})`;
  const scores = (g, pid) => g.runs.filter(r => r.problem === pid && r.score != null).map(r => r.score);

  function render() {
    if (!D) { $main.replaceChildren(h("p", {class: "empty"}, "Waiting for run data…")); return; }
    const gens = D.generations;
    if (!gens.length) { $main.replaceChildren(h("p", {class: "empty"}, "The run has not written its first generation yet.")); return; }
    if (follow || sel == null || sel >= gens.length) sel = gens.length - 1;
    const g = gens[sel];
    renderHeader(gens);
    $main.replaceChildren(contextCol(g, gens), tasksCol(g), incentiveCol(g, gens));
  }

  // ---------------- header: the board's question and the answer so far
  function renderHeader(gens) {
    const doneGens = gens.filter(g => g.runs.some(r => r.score != null));
    const first = doneGens[0], last = doneGens[doneGens.length - 1];
    const delta = split => {
      if (!first || first === last) return null;
      const pids = D.problems.filter(p => split === "holdout" ? isHold(p) : !isHold(p));
      const m = g => mean(pids.map(p => mean(scores(g, p))).filter(x => x != null));
      const a = m(first), b = m(last);
      return a == null || b == null ? null : b - a;
    };
    const dTrain = delta("train"), dHold = delta("holdout");
    const live = !EMBED;
    $hdr.replaceChildren(
      h("div", {class: "toprow"},
        h("h1", {}, "Agent Tracker"),
        h("div", {class: "status"},
          live ? h("span", {class: "live"}, h("span", {class: "dot" + (D.phase === "finished" ? "" : " on")}), failed ? "connection lost, retrying" : "live") : h("span", {}, "snapshot"),
          h("span", {}, D.run), h("span", {}, D.phase), h("span", {class: "mono"}, `$${D.usd.toFixed(2)} · ${D.calls} calls`))),
      h("div", {class: "goal"}, "Can agents improve ", h("b", {}, "agent context / harness"), " meaningfully?"),
      h("div", {class: "answer"},
        ans(dTrain, "mean score change on training tasks, gen " + (first ? first.gen : 0) + " → " + (last ? last.gen : 0)),
        ans(dHold, "on held-out tasks (never reflected on)"),
        ans(gens[gens.length - 1].playbook.length, "bullets in shared context", true)),
      h("div", {class: "gens", role: "group", "aria-label": "Generation"},
        gens.map((x, i) => h("button", {"aria-pressed": String(i === sel), onclick: () => { sel = i; follow = i === gens.length - 1; render(); }}, "gen " + x.gen)),
        h("span", {class: "again", title: "each generation feeds the next"}, "again ↻")));
  }
  function ans(v, l, raw) {
    return h("div", {}, h("span", {class: "v"}, v == null ? "–" : raw ? String(v) : fmtScore(v)), h("span", {class: "l"}, l));
  }

  // ---------------- left: shared context + improve
  function contextCol(g, gens) {
    const col = h("section", {class: "col col-ctx", "aria-label": "Shared context"},
      h("h2", {class: "stage"}, "shared context", h("small", {}, `playbook gen ${g.gen}'s agents saw`)));
    const pb = h("div", {class: "box"});
    if (!g.playbook.length) pb.append(h("p", {class: "empty"}, g.gen === 0 ? "Empty: generation 0 is the baseline." : "Empty."));
    for (const b of g.playbook.slice().sort((a, b) => (b.helpful - b.harmful) - (a.helpful - a.harmful)))
      pb.append(h("div", {class: "bullet" + (b.created_gen === g.gen - 1 ? " new" : "")},
        h("div", {class: "meta"}, h("span", {class: "id"}, b.id), h("span", {class: "votes"}, `+${b.helpful} / −${b.harmful}`)),
        h("div", {class: "txt"}, b.content)));
    col.append(pb);

    col.append(h("h2", {class: "stage"}, "improve", h("small", {}, `what gen ${g.gen} taught the next`)));
    const imp = h("div", {class: "box"});
    const refl = Object.entries(g.reflections || {});
    if (!refl.length) imp.append(h("p", {class: "empty"}, g.gen === gens.length - 1 ? (D.phase === "finished" ? "Last generation: evaluated only." : "Not reflected on yet.") : "No reflection saved."));
    for (const [pid, r] of refl)
      imp.append(h("details", {class: "lessons"}, h("summary", {}, `${short(pid)}: ${r.lessons.length} lessons`),
        r.divergence ? h("p", {class: "muted", style: "margin:6px 0 0;font-size:13px"}, r.divergence) : null,
        h("ul", {}, r.lessons.map(l => h("li", {}, h("span", {class: "chip"}, l.scope), " ", l.content)))));
    if (g.changes) {
      const c = g.changes;
      imp.append(h("div", {class: "chg"}, h("span", {class: "chip acc"}, `+${c.added.length} added`), h("span", {class: "chip"}, `${c.voted.length} votes`),
        h("span", {class: "chip"}, `${c.deduped.length} near-duplicates`), h("span", {class: "chip"}, `${c.pruned.length} pruned`)));
    }
    col.append(imp);
    return col;
  }

  // ---------------- middle: one lane per task, one card per agent
  function tasksCol(g) {
    const col = h("section", {class: "col", "aria-label": "Agents by task"},
      h("h2", {class: "stage"}, "same task", h("small", {}, "every agent of this generation, grouped by task")));
    for (const pid of D.problems) {
      const runs = g.runs.filter(r => r.problem === pid);
      const sc = runs.filter(r => r.score != null).map(r => r.score);
      const t = D.tasks[pid];
      col.append(h("div", {class: "lane"},
        h("div", {class: "lanehead"}, h("h2", {}, short(pid)), h("span", {class: "chip" + (isHold(pid) ? "" : " acc")}, isHold(pid) ? "held out" : "train"),
          h("span", {class: "stat"}, `QoI ${t.qoi} · cap ${t.node_cap} nodes`),
          sc.length ? h("span", {class: "stat"}, "mean ", scorePill(mean(sc)), " best ", scorePill(Math.max(...sc))) : null),
        runs.length ? h("div", {class: "cards"}, runs.map(card)) : h("p", {class: "empty"}, "No agents started yet.")));
    }
    return col;
  }

  function card(r) {
    const n = r.run_id.split("-").pop();
    if (r.state === "running" || r.state === "finished, checking") {
      return h("div", {class: "card running"}, h("div", {class: "top"}, h("span", {class: "who"}, "agent " + n), h("span", {class: "pill p-mid"}, r.state)),
        h("div", {class: "tries"}, "meshes so far:", r.meshes.map(() => h("b", {class: "t-unk"}))));
    }
    if (r.state === "error") return h("div", {class: "card"}, h("div", {class: "top"}, h("span", {class: "who"}, "agent " + n), h("span", {class: "pill p-bad"}, "crashed")),
      h("p", {class: "muted", style: "margin:0"}, "API or code error; not scored."));
    const kids = [h("div", {class: "top"}, h("span", {class: "who"}, "agent " + n),
      h("span", {}, r.rank ? h("span", {class: "rank" + (r.rank === 1 ? " first" : ""), title: "placing within this task"}, `${r.rank}/${r.of} `) : null, scorePill(r.score)))];
    kids.push(curve(r));
    if (r.profile) kids.push(h("div", {class: "prof", title: "strengths and weaknesses, 0 to 1"},
      Object.entries(r.profile).flatMap(([k, v]) => [h("span", {}, k), h("div", {class: "bar"}, h("i", {style: `width:${Math.round(v * 100)}%`}))])));
    kids.push(h("div", {class: "tries", title: "each mesh attempt: green fits the node cap, red is over"}, "meshes:",
      r.meshes.map(m => h("b", {class: m == null ? "t-unk" : m <= r.cap ? "t-fit" : "t-over", title: m == null ? "failed" : `${m} nodes`}))));
    if (r.gate) kids.push(h("div", {class: "issues"}, "gate: " + r.gate));
    else if (r.issues && r.issues.length) kids.push(h("div", {class: "issues", title: r.issues.join("\n")}, `setup differs from reference (${r.issues.length})`));
    kids.push(h("div", {class: "foot"}, h("span", {class: "mono"}, r.nodes ? `${r.nodes}/${r.cap} nodes · P${r.order}` : "no solve"),
      h("span", {class: "mono"}, `${r.turns} turns · $${r.usd.toFixed(3)}`)));
    if (r.cited && r.cited.length) kids.push(h("div", {class: "chg"}, r.cited.map(c => h("span", {class: "chip acc"}, c))));
    return h("div", {class: "card"}, kids);
  }

  // error of each solve on a log scale; dashed line = best uniform mesh at the cap; ring = scored solve
  function curve(r) {
    const W = 200, H = 54, L = 4, R = 4, T = 6, B = 12;
    const errs = r.solve_errors || [];
    const pts = errs.map((e, i) => e == null ? null : [i, Math.log10(Math.max(e, 1e-6))]);
    const ys = pts.filter(Boolean).map(p => p[1]).concat(r.e_uniform ? [Math.log10(r.e_uniform)] : []);
    const svg = S("svg", {viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "relative error of each solve"});
    if (!ys.length) return h("div", {class: "curve"}, svg);
    const lo = Math.min(...ys) - 0.3, hi = Math.max(...ys) + 0.3;
    const x = i => errs.length <= 1 ? W / 2 : L + i * (W - L - R) / (errs.length - 1);
    const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
    if (r.e_uniform) {
      svg.append(S("line", {x1: 0, x2: W, y1: y(Math.log10(r.e_uniform)), y2: y(Math.log10(r.e_uniform)), stroke: "var(--muted)", "stroke-dasharray": "3 3", "stroke-width": 1}));
      svg.append(S("text", {x: W - 2, y: y(Math.log10(r.e_uniform)) - 2, "text-anchor": "end"}, "uniform"));
    }
    const ok = pts.filter(Boolean);
    if (ok.length > 1) svg.append(S("polyline", {points: ok.map(p => x(p[0]) + "," + y(p[1])).join(" "), fill: "none", stroke: "var(--accent)", "stroke-width": 2}));
    const scored = r.submitted != null ? r.submitted : ok.length ? ok[ok.length - 1][0] : -1;
    for (const p of ok) {
      const c = S("circle", {cx: x(p[0]), cy: y(p[1]), r: p[0] === scored ? 5 : 3.5, fill: p[0] === scored ? "var(--panel)" : "var(--accent)", stroke: "var(--accent)", "stroke-width": 2});
      c.append(S("title", {}, `solve ${p[0] + 1}: error ${fmtPct(Math.pow(10, p[1]))}${p[0] === scored ? " (scored)" : ""}`));
      svg.append(c);
    }
    svg.append(S("text", {x: L, y: H - 1}, `error per solve · scored ${fmtPct(r.rel_error)}`));
    return h("div", {class: "curve"}, svg);
  }

  // ---------------- right: incentive
  function incentiveCol(g, gens) {
    const col = h("section", {class: "col", "aria-label": "Incentive"}, h("h2", {class: "stage"}, "incentive?"));
    col.append(h("div", {class: "box strip"}, h("h3", {}, `How well did you place · gen ${g.gen}`), placing(g)));
    col.append(h("div", {class: "box chart"}, h("h3", {}, "How well did everyone do"), everyone(gens),
      h("div", {class: "legend"}, D.problems.map(p => h("span", {}, h("i", {class: isHold(p) ? "dash" : "", style: `border-color:${colorOf(p)}`}), short(p))))));
    const roles = Object.entries(D.usd_by_role).map(([k, v]) => `${k} $${v.toFixed(2)}`).join(" · ");
    col.append(h("div", {class: "box"}, h("h3", {}, "Spend"), h("div", {class: "mono"}, roles || "–"),
      h("div", {class: "muted", style: "font-size:12px"}, `models: ${Object.entries(D.models).map(([k, v]) => k + " " + v.replace("claude-", "")).join(", ")}`)));
    return col;
  }

  // one row per task: every agent as a dot on the score axis; ring = best
  function placing(g) {
    const W = 300, rowH = 26, L = 4, R = 4, T = 14;
    const lo = D.score_floor, hi = Math.max(1.5, ...g.runs.filter(r => r.score != null).map(r => r.score));
    const x = v => L + (v - lo) / (hi - lo) * (W - L - R);
    const svg = S("svg", {viewBox: `0 0 ${W} ${T + rowH * D.problems.length + 14}`, role: "img", "aria-label": "each agent's score, by task"});
    for (let v = Math.ceil(lo); v <= Math.floor(hi); v++) {
      svg.append(S("line", {x1: x(v), x2: x(v), y1: T - 4, y2: T + rowH * D.problems.length, stroke: v === 0 ? "var(--muted)" : "var(--line)", "stroke-dasharray": v === 0 ? "3 3" : "none"}));
      svg.append(S("text", {x: x(v), y: T + rowH * D.problems.length + 11, "text-anchor": "middle", class: "num", fill: "var(--muted)", style: "font:10px var(--body)"}, (v > 0 ? "+" : "") + v));
    }
    svg.append(S("text", {x: x(0) + 3, y: 9, fill: "var(--muted)", style: "font:10px var(--body)"}, "uniform mesh"));
    D.problems.forEach((pid, i) => {
      const yy = T + i * rowH + rowH / 2;
      svg.append(S("text", {x: L, y: yy - 7, fill: "var(--ink-2)", style: "font:500 10.5px var(--mono)"}, short(pid)));
      const rs = g.runs.filter(r => r.problem === pid && r.score != null);
      for (const r of rs) {
        const c = S("circle", {cx: x(r.score), cy: yy + 3, r: r.rank === 1 ? 5.5 : 4, fill: colorOf(pid), opacity: r.rank === 1 ? 1 : .6, stroke: "var(--panel)", "stroke-width": 1.5});
        c.append(S("title", {}, `${r.run_id}: ${fmtScore(r.score)} (placed ${r.rank}/${r.of})`));
        svg.append(c);
      }
    });
    return svg;
  }

  // mean score per generation per task; solid = train, dashed = held out
  function everyone(gens) {
    const W = 300, H = 170, L = 26, R = 22, T = 10, B = 20;   // R leaves room for the last label
    const means = D.problems.map(p => gens.map(g => mean(scores(g, p))));
    const vals = means.flat().filter(v => v != null);
    const svg = S("svg", {viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "mean score per generation, per task"});
    if (!vals.length) return svg;
    const lo = Math.min(0, ...vals) - 0.2, hi = Math.max(1, ...vals) + 0.2;
    const x = i => gens.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (gens.length - 1);
    const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
    for (let v = Math.ceil(lo * 2) / 2; v <= hi; v += 0.5) {
      svg.append(S("line", {x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--muted)" : "var(--line)", "stroke-dasharray": v === 0 ? "3 3" : "none"}));
      if (Number.isInteger(v)) svg.append(S("text", {x: L - 4, y: y(v) + 3, "text-anchor": "end"}, (v > 0 ? "+" : "") + v));
    }
    gens.forEach((g, i) => svg.append(S("text", {x: x(i), y: H - 5, "text-anchor": "middle"}, "gen " + g.gen)));
    D.problems.forEach((pid, k) => {
      const pts = means[k].map((m, i) => m == null ? null : [x(i), y(m), m, gens[i].gen]).filter(Boolean);
      if (pts.length > 1) svg.append(S("polyline", {points: pts.map(p => p[0] + "," + p[1]).join(" "), fill: "none", stroke: colorOf(pid), "stroke-width": 2, "stroke-dasharray": isHold(pid) ? "5 4" : "none"}));
      for (const p of pts) { const c = S("circle", {cx: p[0], cy: p[1], r: 3.5, fill: colorOf(pid), stroke: "var(--panel)", "stroke-width": 1.5});
        c.append(S("title", {}, `${pid}, gen ${p[3]}: mean ${fmtScore(p[2])}`)); svg.append(c); }
    });
    return svg;
  }

  // ---------------- data: embedded snapshot, or poll the local watcher
  async function poll() {
    try {
      const r = await fetch("data.json", {cache: "no-store"});
      if (!r.ok) throw new Error(r.status);
      D = await r.json(); failed = false;
    } catch (e) { failed = true; }
    render();
    setTimeout(poll, D && D.phase === "finished" ? 20000 : 4000);
  }
  if (EMBED) render(); else poll();
})();
</script>
